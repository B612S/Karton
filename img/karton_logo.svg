<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="top" x1="10" y1="12" x2="38" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7cf91"/>
      <stop offset="1" stop-color="#e9a956"/>
    </linearGradient>
    <linearGradient id="front" x1="10" y1="20" x2="30" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a34c"/>
      <stop offset="1" stop-color="#c97829"/>
    </linearGradient>
    <linearGradient id="side" x1="26" y1="28" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c97b2d"/>
      <stop offset="1" stop-color="#a95d1d"/>
    </linearGradient>
    <linearGradient id="badge" x1="18" y1="22" x2="30" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f4c63"/>
      <stop offset="1" stop-color="#232a36"/>
    </linearGradient>
  </defs>

  <!-- Open cardboard box: a flat Papirus-style silhouette, no tile or frame. -->
  <path d="M9 19.5 24 11l15 8.5-15 8.5L9 19.5Z" fill="url(#top)"/>
  <path d="M9 19.5 24 28v13L9 32.5v-13Z" fill="url(#front)"/>
  <path d="M24 28l15-8.5v13L24 41V28Z" fill="url(#side)"/>

  <!-- Lid flaps and tape, kept subtle. -->
  <path d="m9 19.5 15 8.5v2l-15-8.5v-2Z" fill="#8e4d16" opacity=".45"/>
  <path d="m24 30 15-8.5v2L24 32v-2Z" fill="#7a3f0d" opacity=".35"/>
  <path d="M21.5 12.9 24 11l2.5 1.4L24 13.8l-2.5-.9Z" fill="#fff" opacity=".38"/>
  <path d="M22.6 19.9 24 19.1l1.4.8-1.4.8-1.4-.8Z" fill="#fff" opacity=".25"/>

  <!-- VM power badge on the box face. -->
  <circle cx="24" cy="29" r="7" fill="url(#badge)"/>
  <path d="M24 24.7v4.1" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M20.6 26.2a4.6 4.6 0 1 0 6.8 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
