<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Karton icon in the same frameless flat idiom as Luma and Luma Converter:
       the cardboard box that gives the app its name, with the VM power mark on
       its front. No plate; one flat tone per surface; the Papirus drop shadow
       (black at 20%, one unit down). The darker overhanging lid and its seam
       keep the mark reading as a box rather than a display at 24 px. -->
  <g transform="translate(0 1)" opacity="0.2">
    <rect x="10" y="12" width="44" height="10" rx="3" fill="#000000"/>
    <rect x="12" y="20" width="40" height="32" rx="2" fill="#000000"/>
  </g>
  <rect x="12" y="20" width="40" height="32" rx="2" fill="#E8A94F"/>
  <rect x="10" y="12" width="44" height="10" rx="3" fill="#D08A35"/>
  <rect x="31.35" y="12" width="1.3" height="10" fill="#B5701F"/>
  <path d="M 35.92 32.72 A 5.8 5.8 0 1 1 28.08 32.72" fill="none" stroke="#2B3644" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 32 29.8 L 32 35.6" fill="none" stroke="#2B3644" stroke-width="2.6" stroke-linecap="round"/>
</svg>
